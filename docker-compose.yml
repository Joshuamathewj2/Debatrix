services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DEBATRIX_PROVIDER: ${DEBATRIX_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ["debatrix-data:/data"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
volumes:
  debatrix-data:
  ollama-data:
